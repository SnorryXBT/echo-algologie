<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600"><rect width="1000" height="600" fill="#f7f5f1"/><text x="34" y="44" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="22" fill="#14181d" text-anchor="start" font-weight="700">Particulaire ou non particulaire : ce qui se joue en aval de l'aiguille</text><text x="34" y="68" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14.5" fill="#5b6672" text-anchor="start" font-weight="400">Pourquoi tout le mémo impose la dexaméthasone dès qu'une artère chemine dans le champ.</text>
<defs><marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="ar-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#047857"/></marker>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#8a9099" stroke-width="2" stroke-opacity=".55"/></pattern></defs>
<rect x="34" y="92" width="452" height="300" rx="10" fill="#fdeceb" stroke="#b91c1c" stroke-width="2"/><text x="54" y="122" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="17" fill="#b91c1c" text-anchor="start" font-weight="700">Particulaire — suspension de cristaux</text><text x="54" y="144" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.5" fill="#5b6672" text-anchor="start" font-weight="400">Dépôt retard : c'est l'ester cristallin qui fait la durée d'action.</text>
