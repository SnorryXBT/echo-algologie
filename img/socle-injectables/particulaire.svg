<line x1="212" y1="262" x2="212" y2="292" stroke="#b91c1c" stroke-width="1.4"/>
<text x="212" y="310" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#b91c1c" text-anchor="middle" font-weight="700">Agrégat au carrefour :</text>
<text x="212" y="326" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#b91c1c" text-anchor="middle" font-weight="700">la lumière se bouche</text>
<rect x="300" y="178" width="164" height="116" rx="12" fill="url(#hatch)" stroke="#8a9099" stroke-width="1.5"/>
<text x="382" y="228" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.5" fill="#42474d" text-anchor="middle" font-weight="600">Territoire</text>
<text x="382" y="246" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.5" fill="#42474d" text-anchor="middle" font-weight="600">d'aval infarci</text>
<text x="382" y="312" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" text-anchor="middle" font-weight="400" font-style="italic">Irréversible : pas d'antidote</text>
<text x="54" y="352" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" fill="#14181d" text-anchor="start" font-weight="400">Dépo-Médrol® · Kenacort® retard · Hexatrione®</text><text x="54" y="371" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" fill="#14181d" text-anchor="start" font-weight="400">Célestène® chronodose · Diprostène® (ester retard cristallin)</text>
<text x="54" y="386" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="700">Interdits sur tout site à artère satellite.</text>
<rect x="514" y="92" width="452" height="300" rx="10" fill="#e7f7f0" stroke="#047857" stroke-width="2"/><text x="534" y="122" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="17" fill="#047857" text-anchor="start" font-weight="700">Non particulaire — solution vraie</text><text x="534" y="144" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.5" fill="#5b6672" text-anchor="start" font-weight="400">Rien à agréger : aucune embole possible, durée locale plus courte.</text>
<path d="M542 236 h145 M687 236 L757 198 M687 236 L757 274" fill="none" stroke="#c98a8a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M542 236 h145 M687 236 L757 198 M687 236 L757 274" fill="none" stroke="#f7e3e3" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
