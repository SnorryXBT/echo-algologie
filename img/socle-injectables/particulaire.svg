<circle cx="575" cy="236" r="2.4" fill="#047857" fill-opacity=".85"/>
<circle cx="604" cy="231" r="2.4" fill="#047857" fill-opacity=".85"/>
<circle cx="633" cy="240" r="2.4" fill="#047857" fill-opacity=".85"/>
<circle cx="662" cy="234" r="2.4" fill="#047857" fill-opacity=".85"/>
<circle cx="700" cy="212" r="2.4" fill="#047857" fill-opacity=".85"/>
<circle cx="706" cy="258" r="2.4" fill="#047857" fill-opacity=".85"/>
<circle cx="730" cy="202" r="2.4" fill="#047857" fill-opacity=".85"/>
<circle cx="736" cy="268" r="2.4" fill="#047857" fill-opacity=".85"/>
<circle cx="690" cy="236" r="2.4" fill="#047857" fill-opacity=".85"/>
<text x="692" y="310" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#047857" text-anchor="middle" font-weight="700">Molécules dissoutes : elles passent</text>
<rect x="780" y="178" width="164" height="116" rx="12" fill="#e7f7f0" stroke="#047857" stroke-width="1.5" stroke-opacity=".55"/>
<text x="862" y="228" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.5" fill="#047857" text-anchor="middle" font-weight="600">Territoire</text>
<text x="862" y="246" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.5" fill="#047857" text-anchor="middle" font-weight="600">perfusé</text>
<text x="534" y="352" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" fill="#14181d" text-anchor="start" font-weight="400">Dexaméthasone phosphate 4 mg/mL — 4 à 10 mg par site.</text><text x="534" y="371" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" fill="#14181d" text-anchor="start" font-weight="400">Voie périneurale hors AMM ; durée d'action locale plus brève.</text>
<text x="534" y="386" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" fill="#047857" text-anchor="start" font-weight="700">Seul choix acceptable en site à risque.</text>
<rect x="34" y="412" width="932" height="128" rx="10" fill="#ffffff" stroke="#d5cfc5" stroke-width="1.5"/>
<text x="54" y="442" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" fill="#b45309" text-anchor="start" font-weight="700">Le piège de nomenclature</text>
<text x="54" y="468" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.5" fill="#14181d" text-anchor="start" font-weight="400">Le phosphate de bétaméthasone seul est bien une solution — mais les spécialités françaises (Célestène® chronodose,</text><text x="54" y="489" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.5" fill="#14181d" text-anchor="start" font-weight="400">Diprostène®) lui associent un ester retard cristallin : ce sont des suspensions particulaires. Écrire « bétaméthasone »</text><text x="54" y="510" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.5" fill="#14181d" text-anchor="start" font-weight="400">dans un protocole ne dit donc rien du risque : c'est la spécialité qui tranche.</text>
<text x="34" y="582" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start" font-weight="400" font-style="italic">Schéma original — vaisseau et cristaux figurés hors échelle ; la taille des particules n'est pas représentée.</text></svg>