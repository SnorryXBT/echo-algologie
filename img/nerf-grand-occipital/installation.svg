<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect width="400" height="300" fill="#f8fafc"/>
<g fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Nuque vue de dos, patient assis ou en procubitus : occiput en haut, épaules en bas -->
  <path d="M200,26 C142,26 108,68 108,112 C108,140 120,160 134,172"/>
  <path d="M200,26 C258,26 292,68 292,112 C292,140 280,160 266,172"/>
  <!-- oreilles / mastoïdes -->
  <path d="M112,118 C100,114 96,128 104,136 C110,142 118,140 120,134"/>
  <path d="M288,118 C300,114 304,128 296,136 C290,142 282,140 280,134"/>
  <!-- ligne nuchale supérieure -->
  <path d="M120,134 C150,152 250,152 280,134" stroke-width="1.6"/>
  <!-- bords du cou -->
  <path d="M134,172 C130,192 126,208 122,224"/>
  <path d="M266,172 C270,192 274,208 278,224"/>
  <!-- épaules -->
  <path d="M122,224 C92,232 56,250 26,276"/>
  <path d="M278,224 C308,232 344,250 374,276"/>
  <path d="M122,224 C160,236 240,236 278,224"/>
  <!-- ligne des épineuses -->
  <path d="M200,150 L200,300" stroke-dasharray="5 6" stroke-width="1.3" opacity=".7"/>
  <!-- repères : protubérance occipitale externe et C2 -->
  <g stroke-width="1.3" opacity=".7">
    <circle cx="200" cy="146" r="4"/>
    <circle cx="200" cy="206" r="4"/>
  </g>
</g>
<g transform="translate(234,176) rotate(-43)"><rect x="-39" y="-6.5" width="78" height="13" rx="3" fill="#1d4ed8" fill-opacity=".85" stroke="#1e3a8a"/><rect x="-37" y="3.5" width="74" height="2" fill="#93c5fd" stroke="none"/><circle cx="-33" cy="-11.5" r="3" fill="#1d4ed8" stroke="none"/></g><line x1="290" y1="134" x2="244" y2="178" stroke="#b91c1c" stroke-width="3"/><circle cx="290" cy="134" r="4" fill="#b91c1c" stroke="none"/><text x="74" y="142" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">prot. occipitale externe</text><text x="112" y="216" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">épineuse de C2</text><text x="300" y="104" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">mastoïde</text><g transform="translate(6,232)"><rect x="0" y="0" width="52" height="48" rx="6" fill="#fff" fill-opacity=".9" stroke="#9ca3af" stroke-width="1"/><path d="M8,22 a4,4 0 1,0 0.1,0 M12,22 C20,20 26,16 30,16 C36,16 40,20 44,24 M22,26 L36,26 M6,31 L46,31" stroke="#1f2937" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="0" y="58" text-anchor="start" font-size="9" fill="#374151" stroke="none">Procubitus</text></g><g font-size="9.5" fill="#374151" stroke="none" transform="translate(330,262)"><rect x="0" y="0" width="14" height="8" rx="2" fill="#1d4ed8"/><text x="18" y="8">sonde</text><line x1="0" y1="22" x2="14" y2="22" stroke="#b91c1c" stroke-width="3"/><text x="18" y="26">aiguille</text></g><text x="200" y="13" text-anchor="middle" font-size="9.5" fill="#374151" stroke="none"><tspan x="200" dy="0">Procubitus, tête fléchie ; sonde axiale oblique C2 → mastoïde, dans l'axe</tspan><tspan x="200" dy="12">de l'oblique inférieur ; aiguille in-plane de latéral en médial</tspan></text>
</svg>