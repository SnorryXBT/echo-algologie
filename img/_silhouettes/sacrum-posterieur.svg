<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Bassin vu de dos centré sur le sacrum, patient en procubitus : tête en haut, sillon interfessier en bas -->
  <path d="M78,0 C70,40 50,84 42,132 C34,190 44,250 60,300"/>
  <path d="M322,0 C330,40 350,84 358,132 C366,190 356,250 340,300"/>
  <!-- sillon interfessier -->
  <path d="M200,236 L200,300"/>
  <!-- ligne des épineuses lombaires -->
  <path d="M200,0 L200,70" stroke-dasharray="5 6" stroke-width="1.3" opacity=".7"/>
  <g stroke-width="1.3" stroke-dasharray="4 4" opacity=".7">
    <!-- crêtes iliaques jusqu'aux EIPS -->
    <path d="M56,84 C84,40 136,44 158,98"/>
    <path d="M344,84 C316,40 264,44 242,98"/>
    <!-- sacrum -->
    <path d="M146,82 L254,82 C250,130 232,180 212,212 L188,212 C168,180 150,130 146,82 Z"/>
    <!-- interlignes sacro-iliaques -->
    <path d="M160,104 C164,130 172,156 184,178"/>
    <path d="M240,104 C236,130 228,156 216,178"/>
    <!-- coccyx -->
    <path d="M190,216 C192,234 196,248 200,254 C204,248 208,234 210,216"/>
  </g>
  <g stroke-width="1.3" opacity=".7">
    <!-- épines iliaques postéro-supérieures -->
    <circle cx="160" cy="98" r="4"/>
    <circle cx="240" cy="98" r="4"/>
    <!-- cornes sacrées -->
    <circle cx="192" cy="206" r="3"/>
    <circle cx="208" cy="206" r="3"/>
    <!-- crête sacrée médiane -->
    <path d="M200,92 L200,190" stroke-dasharray="1 5"/>
  </g>
</svg>
