<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="-apple-system, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/></marker></defs>
<rect width="860" height="500" fill="#f8fafc"/>
<text x="14" y="20" font-size="11" font-weight="400" fill="#475569" text-anchor="start" stroke="#f8fafc" stroke-width="3.5" paint-order="stroke" >Coupe transversale thoracique, moitié droite — arrière en haut (côté sonde), ligne médiane à gauche</text>
<!-- peau et graisse -->
<path d="M120,52 Q400,34 600,70" fill="none" stroke="#1f2937" stroke-width="2"/>
<!-- poumon / plèvre -->
<path d="M262,500 Q262,420 300,372 Q330,338 400,330 Q520,322 600,372 L600,500 Z" fill="#dbeafe" stroke="none"/>
<path d="M262,500 Q262,420 300,372 Q330,338 400,330 Q520,322 600,372" fill="none" stroke="#0891b2" stroke-width="3"/>
<!-- trapèze, rhomboïde -->
<path d="M150,66 Q400,50 596,84 L590,104 Q400,72 152,88 Z" fill="#f3c6c0" stroke="#9f5a52" stroke-width="1"/>
<path d="M230,90 Q400,78 588,108 L582,128 Q400,100 232,112 Z" fill="#efb8b0" stroke="#9f5a52" stroke-width="1"/>
