<g transform="translate(166,70) rotate(14)"><rect x="-22" y="-5.5" width="44" height="11" rx="3" fill="#1d4ed8" fill-opacity=".85" stroke="#1e3a8a"/><rect x="-20" y="2.5" width="40" height="2" fill="#93c5fd" stroke="none"/><circle cx="-16" cy="-10.5" r="3" fill="#1d4ed8" stroke="none"/></g><line x1="118" y1="58" x2="144" y2="66" stroke="#b91c1c" stroke-width="3"/><circle cx="118" cy="58" r="4" fill="#b91c1c" stroke="none"/><text x="226" y="92" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">manubrium</text><text x="226" y="116" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">angle de Louis (2e cartilage)</text><text x="40" y="50" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">clavicule</text><text x="110" y="222" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">jonctions chondro-costales</text><g transform="translate(6,232)"><rect x="0" y="0" width="52" height="48" rx="6" fill="#fff" fill-opacity=".9" stroke="#9ca3af" stroke-width="1"/><path d="M8,24 a4,4 0 1,0 0.1,0 M12,24 L44,24 M20,24 L22,17 M34,24 L44,26 M6,30 L46,30" stroke="#1f2937" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="26" y="58" text-anchor="middle" font-size="9" fill="#374151" stroke="none">Décubitus dorsal</text></g><g font-size="9.5" fill="#374151" stroke="none" transform="translate(330,262)"><rect x="0" y="0" width="14" height="8" rx="2" fill="#1d4ed8"/><text x="18" y="8">sonde</text><line x1="0" y1="22" x2="14" y2="22" stroke="#b91c1c" stroke-width="3"/><text x="18" y="26">aiguille</text></g><text x="200" y="13" text-anchor="middle" font-size="9.5" fill="#374151" stroke="none"><tspan x="200" dy="0">Décubitus dorsal, coussin interscapulaire ; sonde transversale sur</tspan><tspan x="200" dy="12">l'interligne ; aiguille in-plane latéro-médiale, tangentielle</tspan></text>
</svg>