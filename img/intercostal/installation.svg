<g transform="translate(148,222) rotate(90)"><rect x="-29" y="-6" width="58" height="12" rx="3" fill="#1d4ed8" fill-opacity=".85" stroke="#1e3a8a"/><rect x="-27" y="3" width="54" height="2" fill="#93c5fd" stroke="none"/><circle cx="-23" cy="-11" r="3" fill="#1d4ed8" stroke="none"/></g><line x1="149" y1="282" x2="148" y2="252" stroke="#b91c1c" stroke-width="3"/><circle cx="149" cy="282" r="4" fill="#b91c1c" stroke="none"/><text x="206" y="84" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">C7</text><text x="208" y="180" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">≈ T7 (pointe des scapulas)</text><text x="70" y="180" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">angle costal, 6–8 cm</text><g transform="translate(6,232)"><rect x="0" y="0" width="52" height="48" rx="6" fill="#fff" fill-opacity=".9" stroke="#9ca3af" stroke-width="1"/><path d="M8,24 a4,4 0 1,0 0.1,0 M12,24 L44,24 M20,24 L24,30 M34,24 L44,22 M6,31 L46,31" stroke="#1f2937" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="0" y="58" text-anchor="start" font-size="9" fill="#374151" stroke="none">Décubitus ventral</text></g><g font-size="9.5" fill="#374151" stroke="none" transform="translate(330,262)"><rect x="0" y="0" width="14" height="8" rx="2" fill="#1d4ed8"/><text x="18" y="8">sonde</text><line x1="0" y1="22" x2="14" y2="22" stroke="#b91c1c" stroke-width="3"/><text x="18" y="26">aiguille</text></g><text x="200" y="13" text-anchor="middle" font-size="9.5" fill="#374151" stroke="none"><tspan x="200" dy="0">Décubitus ventral ; sonde sagittale, perpendiculaire aux côtes, à 6–8 cm de</tspan><tspan x="200" dy="12">la ligne médiane ; aiguille in-plane caudo-crâniale</tspan></text>
