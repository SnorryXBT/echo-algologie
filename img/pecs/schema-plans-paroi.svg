  <text x="59" y="370" text-anchor="middle" font-size="12">Sternum</text>
  <text x="40" y="432" font-size="12">Plèvre</text><text x="200" y="462" text-anchor="middle" font-size="12" fill="#475569">Poumon</text>
  <text x="736" y="120" font-size="12" text-anchor="end">Tissu sous-cutané</text>
  <text x="290" y="88" text-anchor="end" font-size="12">N. pectoral latéral</text>
  <text x="300" y="46" font-size="12">Br. pectorale de l'a. thoraco-acromiale</text>
  <text x="380" y="168" text-anchor="middle" font-size="12">N. pectoral médial</text>
  <text x="584" y="216" text-anchor="middle" font-size="12">N. thoracique long</text>
  <text x="736" y="240" text-anchor="end" font-size="12">N. et a. thoraco-dorsaux</text>
</g>
<g font-size="12" font-weight="600" fill="#713f12" stroke="#f8fafc" stroke-width="3.5" paint-order="stroke">
