  <text x="432" y="336">PECS II</text>
  <text x="440" y="452" text-anchor="middle" opacity=".7">Plan profond du dentelé</text>
  <text x="650" y="452" text-anchor="middle" opacity=".7">Plan superficiel du dentelé</text>
</g>
<g stroke="#1d4ed8" stroke-width="1.1" fill="none" opacity=".8"><path d="M440,440 L486,357 M650,440 L676,326"/></g>
<text x="380" y="490" text-anchor="middle" font-size="11.5" fill="#475569">Schéma de principe, déroulé, non à l'échelle — en bleu plein les plans visés par la fiche, en pointillé ceux du bloc du dentelé</text>
</svg>