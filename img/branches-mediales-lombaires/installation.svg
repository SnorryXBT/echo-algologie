<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect width="400" height="300" fill="#f8fafc"/>
<g fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Région lombaire vue de dos, patient en procubitus : tête en haut, sillon interfessier en bas -->
  <path d="M92,0 C98,48 112,92 110,132 C108,172 84,214 72,300"/>
  <path d="M308,0 C302,48 288,92 290,132 C292,172 316,214 328,300"/>
  <!-- sillon interfessier -->
  <path d="M200,252 L200,300"/>
  <!-- ligne des épineuses -->
  <path d="M200,0 L200,246" stroke-dasharray="5 6" stroke-width="1.3" opacity=".7"/>
  <g stroke-width="1.3" stroke-dasharray="4 4" opacity=".7">
    <!-- 12es côtes -->
    <path d="M190,62 C160,72 130,90 110,118"/>
    <path d="M210,62 C240,72 270,90 290,118"/>
    <!-- crêtes iliaques -->
    <path d="M180,222 C164,196 134,180 98,178"/>
    <path d="M220,222 C236,196 266,180 302,178"/>
    <!-- ligne bi-crête (≈ L4) -->
    <path d="M104,178 L296,178" stroke-dasharray="2 5"/>
  </g>
  <!-- épineuses L1 à L5 et épines iliaques postéro-supérieures -->
  <g stroke-width="1.3" opacity=".7">
    <ellipse cx="200" cy="92" rx="3" ry="6"/>
    <ellipse cx="200" cy="120" rx="3" ry="6"/>
    <ellipse cx="200" cy="148" rx="3" ry="6"/>
    <ellipse cx="200" cy="176" rx="3" ry="6"/>
    <ellipse cx="200" cy="204" rx="3" ry="6"/>
    <circle cx="178" cy="226" r="4"/>
    <circle cx="222" cy="226" r="4"/>
  </g>
</g>
<g transform="translate(224,192) rotate(0)"><rect x="-23" y="-6.5" width="46" height="13" rx="3" fill="#1d4ed8" fill-opacity=".85" stroke="#1e3a8a"/><rect x="-21" y="3.5" width="42" height="2" fill="#93c5fd" stroke="none"/><circle cx="-17" cy="-11.5" r="3" fill="#1d4ed8" stroke="none"/></g><line x1="278" y1="182" x2="250" y2="190" stroke="#b91c1c" stroke-width="3"/><circle cx="278" cy="182" r="4" fill="#b91c1c" stroke="none"/><text x="206" y="44" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">ligne des épineuses</text><text x="8" y="170" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">ligne bi-crête ≈ L4</text><text x="138" y="240" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">EIPS</text><text x="300" y="204" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">crête iliaque</text><text x="296" y="100" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">12e côte</text><g transform="translate(6,232)"><rect x="0" y="0" width="52" height="48" rx="6" fill="#fff" fill-opacity=".9" stroke="#9ca3af" stroke-width="1"/><path d="M8,22 a4,4 0 1,0 0.1,0 M12,22 C20,20 26,16 30,16 C36,16 40,20 44,24 M22,26 L36,26 M6,31 L46,31" stroke="#1f2937" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="26" y="58" text-anchor="middle" font-size="9" fill="#374151" stroke="none">Procubitus</text></g><g font-size="9.5" fill="#374151" stroke="none" transform="translate(330,262)"><rect x="0" y="0" width="14" height="8" rx="2" fill="#1d4ed8"/><text x="18" y="8">sonde</text><line x1="0" y1="22" x2="14" y2="22" stroke="#b91c1c" stroke-width="3"/><text x="18" y="26">aiguille</text></g><text x="200" y="13" text-anchor="middle" font-size="9.5" fill="#374151" stroke="none"><tspan x="200" dy="0">Coupe transversale sur le processus transverse du niveau visé ; aiguille</tspan><tspan x="200" dy="12">dans le plan, de latéral en médial</tspan></text>
</svg>