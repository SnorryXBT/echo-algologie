<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect width="400" height="300" fill="#f8fafc"/>
<g fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Région lombaire vue de dos, patient en procubitus : tête en haut, sillon interfessier en bas -->
  <path d="M92,0 C98,48 112,92 110,132 C108,172 84,214 72,300"/>
  <path d="M308,0 C302,48 288,92 290,132 C292,172 316,214 328,300"/>
  <!-- sillon interfessier -->
  <path d="M200,252 L200,300"/>
  <!-- ligne des épineuses -->
  <path d="M200,0 L200,246" stroke-dasharray="5 6" stroke-width="1.3" opacity=".7"/>
  <g stroke-width="1.3" stroke-dasharray="4 4" opacity=".7">
    <!-- 12es côtes -->
    <path d="M190,62 C160,72 130,90 110,118"/>
    <path d="M210,62 C240,72 270,90 290,118"/>
    <!-- crêtes iliaques -->
    <path d="M180,222 C164,196 134,180 98,178"/>
    <path d="M220,222 C236,196 266,180 302,178"/>
    <!-- ligne bi-crête (≈ L4) -->
    <path d="M104,178 L296,178" stroke-dasharray="2 5"/>
  </g>
  <!-- épineuses L1 à L5 et épines iliaques postéro-supérieures -->
  <g stroke-width="1.3" opacity=".7">
    <ellipse cx="200" cy="92" rx="3" ry="6"/>
    <ellipse cx="200" cy="120" rx="3" ry="6"/>
    <ellipse cx="200" cy="148" rx="3" ry="6"/>
    <ellipse cx="200" cy="176" rx="3" ry="6"/>
    <ellipse cx="200" cy="204" rx="3" ry="6"/>
    <circle cx="178" cy="226" r="4"/>
    <circle cx="222" cy="226" r="4"/>
  </g>
</g>
<g transform="translate(211,176) rotate(90)"><rect x="-30" y="-6.5" width="60" height="13" rx="3" fill="#1d4ed8" fill-opacity=".85" stroke="#1e3a8a"/><rect x="-28" y="3.5" width="56" height="2" fill="#93c5fd" stroke="none"/><circle cx="-24" cy="-11.5" r="3" fill="#1d4ed8" stroke="none"/></g><line x1="200" y1="209" x2="200" y2="190" stroke="#b91c1c" stroke-width="3"/><circle cx="200" cy="209" r="4" fill="#b91c1c" stroke="none"/><text x="206" y="44" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">ligne des épineuses</text><text x="8" y="170" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">ligne bi-crête ≈ L4</text><text x="228" y="146" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">sonde à 1–2 cm de la médiane,</text><text x="228" y="159" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">inclinée vers elle de 10–20°</text><text x="78" y="212" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">Tuohy médiane, dans</text><text x="78" y="225" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">l'espace marqué</text><g transform="translate(6,232)"><rect x="0" y="0" width="52" height="48" rx="6" fill="#fff" fill-opacity=".9" stroke="#9ca3af" stroke-width="1"/><path d="M14,10 a4,4 0 1,0 0.1,0 M14,14 L14,26 L26,26 L26,38 M14,26 L14,38 M14,18 L22,20" stroke="#1f2937" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="0" y="58" text-anchor="start" font-size="9" fill="#374151" stroke="none">Assis</text></g><g font-size="9.5" fill="#374151" stroke="none" transform="translate(330,262)"><rect x="0" y="0" width="14" height="8" rx="2" fill="#1d4ed8"/><text x="18" y="8">sonde</text><line x1="0" y1="22" x2="14" y2="22" stroke="#b91c1c" stroke-width="3"/><text x="18" y="26">aiguille</text></g><text x="200" y="13" text-anchor="middle" font-size="9.5" fill="#374151" stroke="none"><tspan x="200" dy="0">Écho-assistance : repérage para-sagittal oblique puis transverse, marquage,</tspan><tspan x="200" dy="12">ponction par perte de résistance</tspan></text>
</svg>