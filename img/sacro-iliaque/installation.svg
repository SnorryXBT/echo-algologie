<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect width="400" height="300" fill="#f8fafc"/>
<g fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Bassin vu de dos centré sur le sacrum, patient en procubitus : tête en haut, sillon interfessier en bas -->
  <path d="M84,0 C76,40 50,84 38,132 C30,166 28,198 32,226"/>
  <path d="M316,0 C324,40 350,84 362,132 C370,166 372,198 368,226"/>
  <!-- sillon interfessier -->
  <path d="M200,236 L200,300"/>
  <!-- ligne des épineuses lombaires -->
  <path d="M200,0 L200,70" stroke-dasharray="5 6" stroke-width="1.3" opacity=".7"/>
  <g stroke-width="1.3" stroke-dasharray="4 4" opacity=".7">
    <!-- crêtes iliaques jusqu'aux EIPS -->
    <path d="M56,84 C84,40 136,44 158,98"/>
    <path d="M344,84 C316,40 264,44 242,98"/>
    <!-- sacrum -->
    <path d="M146,82 L254,82 C250,130 232,180 212,212 L188,212 C168,180 150,130 146,82 Z"/>
    <!-- interlignes sacro-iliaques -->
    <path d="M160,104 C164,130 172,156 184,178"/>
    <path d="M240,104 C236,130 228,156 216,178"/>
    <!-- coccyx -->
    <path d="M190,216 C192,234 196,248 200,254 C204,248 208,234 210,216"/>
  </g>
  <g stroke-width="1.3" opacity=".7">
    <!-- épines iliaques postéro-supérieures -->
    <circle cx="160" cy="98" r="4"/>
    <circle cx="240" cy="98" r="4"/>
    <!-- cornes sacrées -->
    <circle cx="192" cy="206" r="3"/>
    <circle cx="208" cy="206" r="3"/>
    <!-- crête sacrée médiane -->
    <path d="M200,92 L200,190" stroke-dasharray="1 5"/>
  </g>
</g>
<g transform="translate(242,160) rotate(0)"><rect x="-28" y="-6.5" width="56" height="13" rx="3" fill="#1d4ed8" fill-opacity=".85" stroke="#1e3a8a"/><rect x="-26" y="3.5" width="52" height="2" fill="#93c5fd" stroke="none"/><circle cx="-22" cy="-11.5" r="3" fill="#1d4ed8" stroke="none"/></g><line x1="186" y1="150" x2="212" y2="158" stroke="#b91c1c" stroke-width="3"/><circle cx="186" cy="150" r="4" fill="#b91c1c" stroke="none"/><text x="248" y="92" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">EIPS</text><text x="258" y="132" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">interligne sacro-iliaque</text><text x="214" y="212" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">hiatus sacré</text><text x="60" y="60" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">crête iliaque</text><text x="106" y="150" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">sacrum</text><g transform="translate(6,232)"><rect x="0" y="0" width="52" height="48" rx="6" fill="#fff" fill-opacity=".9" stroke="#9ca3af" stroke-width="1"/><path d="M8,22 a4,4 0 1,0 0.1,0 M12,22 C20,20 26,16 30,16 C36,16 40,20 44,24 M22,26 L36,26 M6,31 L46,31" stroke="#1f2937" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="26" y="58" text-anchor="middle" font-size="9" fill="#374151" stroke="none">Procubitus</text></g><g font-size="9.5" fill="#374151" stroke="none" transform="translate(330,262)"><rect x="0" y="0" width="14" height="8" rx="2" fill="#1d4ed8"/><text x="18" y="8">sonde</text><line x1="0" y1="22" x2="14" y2="22" stroke="#b91c1c" stroke-width="3"/><text x="18" y="26">aiguille</text></g><text x="200" y="13" text-anchor="middle" font-size="9.5" fill="#374151" stroke="none"><tspan x="200" dy="0">Sonde transversale sur le tiers caudal de l'interligne ; aiguille dans le</tspan><tspan x="200" dy="12">plan, de médial en latéral</tspan></text>
</svg>