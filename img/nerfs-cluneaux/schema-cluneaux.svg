<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect width="760" height="500" fill="#f8fafc"/>
<!-- Vue postérieure schématique du côté droit : rachis lombaire bas, sacrum, aile iliaque. Nerfs clunéaux supérieurs franchissant la crête iliaque, nerfs clunéaux moyens passant sous le ligament sacro-iliaque postérieur long. Échelle indicative 1 cm ≈ 22 px. -->
<!-- fascia thoraco-lombaire (feuillet postérieur), au-dessus de la crête -->
<path d="M246,24 L640,24 L640,186 C590,120 520,80 440,98 C360,120 318,190 300,236 L246,200 Z" fill="#cbd5e1" opacity=".38"/>
<!-- aile iliaque -->
<path d="M300,236 C318,190 360,120 440,98 C520,80 590,120 640,186 C646,256 606,334 544,382 C484,402 424,382 384,342 C352,312 332,292 322,268 Z" fill="#e7e2d3" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M300,236 C318,190 360,120 440,98 C520,80 590,120 640,186" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
<!-- sacrum et coccyx -->
<path d="M176,198 L284,198 C292,262 270,342 242,404 L218,404 C190,342 168,262 176,198 Z" fill="#e7e2d3" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M230,206 L230,392" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 5" opacity=".6"/>
<g fill="#475569" stroke="none"><circle cx="258" cy="232" r="5.5"/><circle cx="256" cy="272" r="5.5"/><circle cx="252" cy="310" r="5"/><circle cx="247" cy="346" r="4.5"/><circle cx="202" cy="232" r="5.5"/><circle cx="204" cy="272" r="5.5"/><circle cx="208" cy="310" r="5"/><circle cx="213" cy="346" r="4.5"/></g>
<!-- épineuses lombaires -->
<g fill="#d9d3c0" stroke="#1f2937" stroke-width="1.6"><rect x="220" y="34" width="20" height="38" rx="9"/><rect x="220" y="86" width="20" height="38" rx="9"/><rect x="220" y="138" width="20" height="38" rx="9"/></g>
<!-- nerfs clunéaux moyens (S1-S3) -->
<g fill="none" stroke="#ca8a04" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M258,232 C276,244 296,262 330,280 C352,292 372,306 392,326"/>
  <path d="M256,272 C272,282 292,296 318,316 C338,332 352,350 366,372"/>
  <path d="M252,310 C266,318 284,330 302,350 C314,364 322,380 330,398"/>
</g>
<!-- ligament sacro-iliaque postérieur long, par-dessus les nerfs -->
<path d="M294,240 L314,250 L276,350 L258,342 Z" fill="#94a3b8" opacity=".78" stroke="#475569" stroke-width="1.6" stroke-linejoin="round"/>
<g stroke="#475569" stroke-width="1" opacity=".7"><path d="M299,246 L264,342 M305,248 L269,345 M310,251 L273,348"/></g>
<!-- EIPS -->
<circle cx="304" cy="238" r="10" fill="#d9d3c0" stroke="#1f2937" stroke-width="1.8"/>
<!-- nerfs clunéaux supérieurs -->
<g fill="none" stroke="#ca8a04" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
  <path d="M322,30 C336,70 356,104 376,130 C392,160 400,210 410,270"/>
  <path d="M372,28 C392,56 412,80 434,100 C456,140 470,200 482,262"/>
  <path d="M430,26 C452,50 474,72 496,92 C520,130 540,180 556,236"/>
</g>
<!-- tunnel ostéo-fibreux de la branche médiale -->
<ellipse cx="376" cy="130" rx="15" ry="8" transform="rotate(-38 376 130)" fill="none" stroke="#b91c1c" stroke-width="2.6"/>
<!-- cote 6-7 cm -->
<g stroke="#334155" stroke-width="1.3" fill="none"><path d="M230,186 L230,178 M230,182 L368,182 M368,178 L368,186" /><path d="M368,182 L372,142" stroke-dasharray="3 3"/></g>
<!-- empreintes de sonde -->
<g fill="#1d4ed8" fill-opacity=".14" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 4">
  <rect x="-40" y="-9" width="80" height="18" rx="4" transform="translate(384,124) rotate(-36)"/>
  <rect x="246" y="266" width="84" height="18" rx="4"/>
</g>
<!-- étiquettes -->
<g font-size="13" font-weight="600" fill="#1f2937" stroke="#f8fafc" stroke-width="3.5" paint-order="stroke">
  <text x="212" y="58" text-anchor="end">L3</text><text x="212" y="110" text-anchor="end">L4</text><text x="212" y="162" text-anchor="end">L5</text>
  <text x="150" y="300" text-anchor="end">Sacrum</text>
  <text x="560" y="330" text-anchor="middle">Aile iliaque (fosse glutéale)</text>
  <text x="604" y="112">Crête iliaque</text>
  <text x="560" y="52" fill="#475569">Fascia thoraco-lombaire</text>
  <text x="560" y="68" fill="#475569" font-size="12">(feuillet postérieur)</text>
  <text x="299" y="175" font-size="12.5" text-anchor="middle" fill="#334155">6–7 cm</text>
</g>
<g font-size="13" font-weight="600" stroke="#f8fafc" stroke-width="3.5" paint-order="stroke">
  <text x="250" y="18" fill="#854d0e">N. clunéaux supérieurs : branches médiale, intermédiaire, latérale</text>
  <text x="30" y="126" fill="#b91c1c">Tunnel ostéo-fibreux</text>
  <text x="30" y="142" fill="#b91c1c">(branche médiale)</text>
  <text x="60" y="232" fill="#1f2937">EIPS</text>
  <text x="20" y="440" fill="#334155">Lig. sacro-iliaque postérieur long :</text>
  <text x="20" y="456" fill="#334155">EIPS → crête sacrée latérale</text>
  <text x="420" y="440" fill="#854d0e">N. clunéaux moyens (S1–S3), sous le ligament</text>
  <text x="420" y="466" fill="#1d4ed8">Pointillés bleus : empreintes de sonde</text>
  <text x="420" y="482" fill="#1d4ed8">(grand axe de la crête ; transversale 1–2 cm sous l’EIPS)</text>
</g>
<g fill="none" stroke="#64748b" stroke-width="1.1">
  <path d="M160,124 L360,130"/>
  <path d="M96,230 L294,238"/>
  <path d="M150,428 L270,336"/>
  <path d="M470,428 L372,376"/>
</g>
</svg>
