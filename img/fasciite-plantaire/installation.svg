<g transform="translate(205,120) rotate(0)"><rect x="-38" y="-6.5" width="76" height="13" rx="3" fill="#1d4ed8" fill-opacity=".85" stroke="#1e3a8a"/><rect x="-36" y="3.5" width="72" height="2" fill="#93c5fd" stroke="none"/><circle cx="-32" cy="-11.5" r="3" fill="#1d4ed8" stroke="none"/></g><line x1="104" y1="120" x2="163" y2="120" stroke="#b91c1c" stroke-width="3"/><circle cx="104" cy="120" r="4" fill="#b91c1c" stroke="none"/><text x="14" y="64" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">Zone d'appui :</text><text x="14" y="76" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">pas de ponction plantaire</text><text x="46" y="104" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">Tubercule médial</text><text x="30" y="146" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">Aiguille in-plane, voie médiale</text><text x="258" y="118" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">Sonde transversale</text><text x="262" y="196" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">Bandelette centrale</text><g transform="translate(6,232)"><rect x="0" y="0" width="52" height="48" rx="6" fill="#fff" fill-opacity=".9" stroke="#9ca3af" stroke-width="1"/><path d="M8,22 a4,4 0 1,0 0.1,0 M12,22 C20,20 26,16 30,16 C36,16 40,20 44,24 M22,26 L36,26 M6,31 L46,31" stroke="#1f2937" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="26" y="58" text-anchor="middle" font-size="9" fill="#374151" stroke="none">Procubitus</text></g><g font-size="9.5" fill="#374151" stroke="none" transform="translate(330,262)"><rect x="0" y="0" width="14" height="8" rx="2" fill="#1d4ed8"/><text x="18" y="8">sonde</text><line x1="0" y1="22" x2="14" y2="22" stroke="#b91c1c" stroke-width="3"/><text x="18" y="26">aiguille</text></g><text x="200" y="13" text-anchor="middle" font-size="9.5" fill="#374151" stroke="none"><tspan x="200" dy="0">Procubitus, pied hors de table, cheville en dorsiflexion. Sonde</tspan><tspan x="200" dy="12">transversale sur l'insertion calcanéenne, aiguille in-plane par le bord</tspan><tspan x="200" dy="12">médial du talon.</tspan></text>
