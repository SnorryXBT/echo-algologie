<line x1="674" y1="190" x2="946" y2="190" stroke="#5b6672" stroke-width="1.2"/>
<rect x="674" y="160" width="10" height="30" fill="#0f6fff"/>
<rect x="742" y="160" width="10" height="30" fill="#0f6fff"/>
<rect x="810" y="160" width="10" height="30" fill="#0f6fff"/>
<rect x="878" y="160" width="10" height="30" fill="#0f6fff"/>
<text x="674" y="212" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" fill="#14181d" text-anchor="start" font-weight="400">20 ms de courant, 480 ms de silence</text>
<text x="674" y="230" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" fill="#14181d" text-anchor="start" font-weight="400">2 Hz — le tissu a le temps de refroidir.</text>
<text x="674" y="250" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start" font-weight="400">C'est le champ électrique, non la chaleur,</text>
<text x="674" y="266" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start" font-weight="400">qui module la transmission.</text>
<rect x="654" y="286" width="312" height="162" rx="10" fill="#ffffff" stroke="#d5cfc5" stroke-width="1.5"/>
<text x="674" y="312" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14.5" fill="#14181d" text-anchor="start" font-weight="700">Conséquence pratique</text>
<text x="674" y="334" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Thermique : lésion définitive, réservée aux</text><text x="674" y="351.5" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">nerfs purement sensitifs. Repousse en 6 à 12</text><text x="674" y="369" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">mois, parfois avec névrite de déafférentation.</text><text x="674" y="386.5" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400"></text><text x="674" y="404" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Pulsée : pas de lésion. Répétable, utilisable</text><text x="674" y="421.5" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">sur un nerf mixte — au prix d'un effet plus</text><text x="674" y="439" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">court et d'une preuve plus faible.</text>
<text x="34" y="482" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start" font-weight="400" font-style="italic">Schéma original — courbes de principe, non des relevés ; paramètres repris du texte de cette fiche.</text></svg>