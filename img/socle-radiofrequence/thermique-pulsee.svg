<text x="480" y="418" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle" font-weight="400">75</text>
<text x="620" y="418" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle" font-weight="400">100</text>
