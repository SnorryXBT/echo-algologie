<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect width="400" height="300" fill="#f8fafc"/>
<g fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Genou droit vu par sa face médiale, patient en décubitus dorsal, hanche en rotation externe ; cuisse en haut, jambe en bas, antérieur à gauche (patella), postérieur à droite (creux poplité) -->
  <path d="M148,0 C146,48 150,96 156,132 C160,152 166,168 170,182 C176,196 178,206 176,218 C172,252 172,276 174,300"/>
  <path d="M286,0 C288,50 284,98 276,130 C270,146 266,158 268,170 C274,190 278,212 276,236 C274,266 268,284 262,300"/>
  <g stroke-width="1.3" stroke-dasharray="4 4" opacity=".7">
    <!-- patella, de profil : relief antérieur -->
    <path d="M164,140 C158,148 158,166 166,174"/>
    <!-- condyle fémoral médial -->
    <path d="M176,148 C176,128 226,124 236,146 C244,166 228,184 200,184 C180,182 174,166 176,148 Z"/>
    <!-- interligne articulaire médial -->
    <path d="M160,190 L272,184"/>
    <!-- métaphyse tibiale médiale (site NG inféro-médial, patte d'oie 4-6 cm sous l'interligne) -->
    <path d="M168,212 L268,206"/>
    <!-- tubérosité tibiale antérieure -->
    <path d="M172,196 C182,200 184,210 178,216"/>
    <!-- diaphyse fémorale distale (site NG supéro-médial) -->
    <path d="M196,62 L200,124"/>
  </g>
  <path d="M172,24 L174,52 M268,24 L266,52" stroke-width="1" opacity=".5"/>
</g>
<g transform="translate(205,155) rotate(0)"><rect x="-35" y="-6.5" width="70" height="13" rx="3" fill="#1d4ed8" fill-opacity=".85" stroke="#1e3a8a"/><rect x="-33" y="3.5" width="66" height="2" fill="#93c5fd" stroke="none"/><circle cx="-29" cy="-11.5" r="3" fill="#1d4ed8" stroke="none"/></g><line x1="130" y1="170" x2="186" y2="158" stroke="#b91c1c" stroke-width="3"/><circle cx="130" cy="170" r="4" fill="#b91c1c" stroke="none"/><text x="244" y="152" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">condyle fémoral médial</text><text x="236" y="56" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">canal des adducteurs</text><text x="248" y="196" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">interligne médial</text><g transform="translate(6,232)"><rect x="0" y="0" width="52" height="48" rx="6" fill="#fff" fill-opacity=".9" stroke="#9ca3af" stroke-width="1"/><path d="M8,24 a4,4 0 1,0 0.1,0 M12,24 L44,24 M20,24 L22,17 M34,24 L44,26 M6,30 L46,30" stroke="#1f2937" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="26" y="58" text-anchor="middle" font-size="9" fill="#374151" stroke="none">Décubitus dorsal</text></g><g font-size="9.5" fill="#374151" stroke="none" transform="translate(330,262)"><rect x="0" y="0" width="14" height="8" rx="2" fill="#1d4ed8"/><text x="18" y="8">sonde</text><line x1="0" y1="22" x2="14" y2="22" stroke="#b91c1c" stroke-width="3"/><text x="18" y="26">aiguille</text></g><text x="200" y="13" text-anchor="middle" font-size="9.5" fill="#374151" stroke="none"><tspan x="200" dy="0">Sonde transversale sur le condyle fémoral médial ; aiguille 25 G</tspan><tspan x="200" dy="12">tangentielle, d'antérieur en postérieur, dans le plan sous-cutané</tspan></text>
</svg>