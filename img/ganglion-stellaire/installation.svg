<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect width="400" height="300" fill="#f8fafc"/>
<g fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cou droit vu de côté (patient en décubitus dorsal, tête tournée) : visage à gauche, épaule à droite -->
  <!-- crâne -->
  <path d="M140,26 C86,30 62,72 66,112 C68,130 74,140 82,146"/>
  <path d="M140,26 C196,28 216,70 214,112 C212,136 206,150 198,158"/>
  <!-- front, nez, lèvres, menton -->
  <path d="M82,146 C74,152 70,158 76,162 L88,166 C82,174 84,182 92,186 C88,194 92,202 104,204"/>
  <!-- mandibule : menton -> angle -->
  <path d="M104,204 C134,212 172,202 192,176" stroke-width="1.8"/>
  <!-- oreille -->
  <path d="M182,100 C174,86 192,74 202,86 C212,98 206,124 194,132 C188,136 182,130 182,124"/>
  <!-- bords du cou -->
  <path d="M108,204 C120,226 134,242 148,254"/>
  <path d="M200,158 C212,186 224,208 238,224"/>
  <!-- épaule, thorax -->
  <path d="M148,254 C188,262 244,262 286,258 C324,256 356,266 386,284"/>
  <path d="M238,224 C276,228 316,234 346,244"/>
  <path d="M160,262 L176,300"/>
  <!-- SCM (pointillés) : mastoïde -> sternum et clavicule -->
  <g stroke-dasharray="5 5" stroke-width="1.4" opacity=".75">
    <path d="M192,134 C196,172 192,216 180,252"/>
    <path d="M192,134 C210,172 222,206 238,226"/>
  </g>
  <!-- clavicule -->
  <path d="M170,258 C216,250 280,248 330,254" stroke-width="1.6" opacity=".8"/>
</g>
<g transform="translate(174,212) rotate(-18)"><rect x="-35" y="-6" width="70" height="12" rx="3" fill="#1d4ed8" fill-opacity=".85" stroke="#1e3a8a"/><rect x="-33" y="3" width="66" height="2" fill="#93c5fd" stroke="none"/><circle cx="-29" cy="-11" r="3" fill="#1d4ed8" stroke="none"/></g><line x1="238" y1="190" x2="186" y2="208" stroke="#b91c1c" stroke-width="3"/><circle cx="238" cy="190" r="4" fill="#b91c1c" stroke="none"/><text x="76" y="246" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">cricoïde = C6</text><text x="116" y="284" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">abord latéro-médial, rétro-carotidien</text><text x="150" y="128" font-size="10.5" font-weight="600" fill="#1f2937" stroke="#fff" stroke-width="3" paint-order="stroke">tête tournée de 10–20°</text><g transform="translate(6,232)"><rect x="0" y="0" width="52" height="48" rx="6" fill="#fff" fill-opacity=".9" stroke="#9ca3af" stroke-width="1"/><path d="M8,24 a4,4 0 1,0 0.1,0 M12,24 L44,24 M20,24 L22,17 M34,24 L44,26 M6,30 L46,30" stroke="#1f2937" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="0" y="58" text-anchor="start" font-size="9" fill="#374151" stroke="none">Décubitus dorsal</text></g><g font-size="9.5" fill="#374151" stroke="none" transform="translate(330,262)"><rect x="0" y="0" width="14" height="8" rx="2" fill="#1d4ed8"/><text x="18" y="8">sonde</text><line x1="0" y1="22" x2="14" y2="22" stroke="#b91c1c" stroke-width="3"/><text x="18" y="26">aiguille</text></g><text x="200" y="13" text-anchor="middle" font-size="9.5" fill="#374151" stroke="none"><tspan x="200" dy="0">Décubitus dorsal, cou en légère extension ; sonde transversale au cricoïde</tspan><tspan x="200" dy="12">(C6), aiguille in-plane de latéral en médial</tspan></text>
</svg>