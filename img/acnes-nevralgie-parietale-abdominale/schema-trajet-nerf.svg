<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect width="760" height="440" fill="#f8fafc"/>
<!-- Coupe transversale schématique de la paroi abdominale antérieure au bord latéral du muscle droit (au-dessus de la ligne arquée). Médial à gauche, latéral à droite, peau en haut. -->
<!-- peau et graisse sous-cutanée -->
<path d="M20,58 L740,58" stroke="#1f2937" stroke-width="3" fill="none"/>
<rect x="20" y="60" width="720" height="78" fill="#fdf3c7" opacity=".55"/>
<!-- muscle droit -->
<path d="M40,146 L330,146 Q440,148 478,196 Q440,256 330,262 L40,262 Z" fill="#e9b4a8" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="round"/>
<g stroke="#b4695a" stroke-width="1" opacity=".5"><path d="M70,170 L420,172 M60,196 L452,198 M70,222 L430,224 M80,246 L380,246"/></g>
<!-- trois muscles larges -->
<path d="M512,150 L740,140 L740,180 L513,188 Z" fill="#e9b4a8" opacity=".75" stroke="#1f2937" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M513,190 L740,182 L740,224 L515,229 Z" fill="#e9b4a8" opacity=".9" stroke="#1f2937" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M515,235 L740,230 L740,264 L516,268 Z" fill="#e9b4a8" opacity=".7" stroke="#1f2937" stroke-width="1.4" stroke-linejoin="round"/>
<!-- gaine des droits ; aponévroses des trois muscles larges convergeant en ligne semi-lunaire -->
<path d="M490,197 L512,148 L516,270 Z" fill="#94a3b8" opacity=".55" stroke="#475569" stroke-width="1.6" stroke-linejoin="round"/>
<g fill="none" stroke="#475569" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M20,140 L330,140 Q452,140 490,197"/>
  <path d="M20,272 L330,272 Q456,272 490,197"/>
</g>
<!-- fascia transversalis / péritoine -->
<path d="M20,298 Q380,304 740,290" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 4"/>
<!-- vaisseaux épigastriques -->
<circle cx="200" cy="252" r="7" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.2"/>
<ellipse cx="222" cy="253" rx="9" ry="6.5" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.2"/>
<!-- nerf : plan TAP -> gaine -> face postérieure du droit -> virage à 90° -> gaine antérieure -> peau -->
<g fill="none" stroke="#ca8a04" stroke-linecap="round" stroke-linejoin="round">
  <path d="M740,227 L516,232 C490,230 470,226 445,239 C430,247 412,252 412,230 L412,146" stroke-width="4.5"/>
  <path d="M412,146 L412,112 M412,112 Q400,88 372,70 M412,112 Q426,88 456,70" stroke-width="3"/>
</g>
<!-- artériole satellite -->
<path d="M404,240 L404,116" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<!-- anneau fibreux -->
<ellipse cx="409" cy="143" rx="15" ry="6" fill="none" stroke="#b91c1c" stroke-width="2.4"/>
<!-- cibles d'injection -->
<ellipse cx="320" cy="267" rx="80" ry="6" fill="#3b82f6" opacity=".35"/>
<!-- étiquettes -->
<g font-size="13.5" font-weight="600" fill="#1f2937" stroke="#f8fafc" stroke-width="3.5" paint-order="stroke">
  <text x="28" y="40">Médial (ligne blanche)</text>
  <text x="732" y="40" text-anchor="end">Latéral</text>
  <text x="30" y="84">Graisse sous-cutanée</text>
  <text x="150" y="206">Muscle droit de l’abdomen</text>
  <text x="622" y="168" text-anchor="middle" font-size="12.5">Oblique externe</text>
  <text x="622" y="211" text-anchor="middle" font-size="12.5">Oblique interne</text>
  <text x="622" y="254" text-anchor="middle" font-size="12.5">Transverse</text>
  <text x="28" y="132" font-size="12.5" fill="#334155">Gaine antérieure</text>
  <text x="28" y="290" font-size="12.5" fill="#334155">Gaine postérieure</text>
  <text x="28" y="324" font-size="12.5" fill="#475569">Fascia transversalis, péritoine</text>
</g>
<g font-size="13" font-weight="600" stroke="#f8fafc" stroke-width="3.5" paint-order="stroke">
  <text x="440" y="352" fill="#334155">Ligne semi-lunaire</text>
  <text x="590" y="326" fill="#854d0e" text-anchor="middle">N. intercostal (T7–T12) dans le plan du transverse</text>
  <text x="262" y="108" fill="#b91c1c" text-anchor="middle">Anneau fibreux de la gaine antérieure :</text>
  <text x="262" y="124" fill="#b91c1c" text-anchor="middle">virage à 90°, siège du piégeage</text>
  <text x="560" y="88" fill="#854d0e">Rameaux cutanés antérieurs</text>
  <text x="130" y="360" fill="#991b1b">Vaisseaux épigastriques</text>
  <text x="330" y="386" fill="#1d4ed8" text-anchor="middle">Plan d’injection : entre muscle et gaine postérieure</text>
  <text x="330" y="402" fill="#1d4ed8" text-anchor="middle">(nappe remontant jusqu’au bord latéral)</text>
</g>
<g fill="none" stroke="#64748b" stroke-width="1.1">
  <path d="M496,340 L504,222"/>
  <path d="M600,312 L600,234"/>
  <path d="M372,128 L396,140"/>
  <path d="M556,84 L452,76"/>
  <path d="M200,346 L208,262"/>
  <path d="M330,372 L330,272"/>
</g>
</svg>
