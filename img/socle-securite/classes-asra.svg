<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 592" width="1000" height="592"><rect width="1000" height="592" fill="#f7f5f1"/><text x="34" y="44" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="22" fill="#14181d" text-anchor="start" font-weight="700">Les trois classes de risque hémorragique (ASRA-ESRA 2018)</text><text x="34" y="68" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14.5" fill="#5b6672" text-anchor="start" font-weight="400">La classe se lit sur le geste, jamais sur le patient : elle décide si la question de l'arrêt se pose.</text>
<rect x="34" y="92" width="300" height="400" rx="10" fill="#e7f7f0" stroke="#047857" stroke-width="2"/><rect x="35.5" y="92" width="297" height="46" rx="9" fill="#047857" stroke="#d5cfc5" stroke-width="1.5"/><rect x="35.5" y="120" width="297" height="18" fill="#047857"/><text x="184" y="122" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="16.5" fill="#fff" text-anchor="middle" font-weight="700">Faible</text><text x="54" y="168" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" fill="#047857" text-anchor="start" font-weight="700" letter-spacing=".06em">Gestes</text><text x="54" y="190" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Blocs nerveux périphériques</text><text x="54" y="208" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Infiltrations articulaires</text><text x="54" y="226" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">périphériques</text><text x="54" y="244" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Points-gâchettes</text><text x="54" y="262" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Nerf grand occipital</text><text x="54" y="280" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Sacro-iliaque</text><text x="54" y="298" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Blocs de paroi</text><text x="54" y="316" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400"></text><text x="54" y="334" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">La quasi-totalité du mémo.</text><text x="54" y="374" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" fill="#047857" text-anchor="start" font-weight="700" letter-spacing=".06em">Conduite</text><text x="54" y="396" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Pas d'interruption des</text><text x="54" y="414" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">antiagrégants.</text><text x="54" y="432" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Anticoagulants poursuivis dans</text><text x="54" y="450" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">la plupart des cas, au cas par cas.</text><text x="54" y="472" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" fill="#5b6672" text-anchor="start" font-weight="400" font-style="italic">Arrêter expose plus qu'il ne protège.</text>
<rect x="350" y="92" width="300" height="400" rx="10" fill="#fff5e6" stroke="#b45309" stroke-width="2"/><rect x="351.5" y="92" width="297" height="46" rx="9" fill="#b45309" stroke="#d5cfc5" stroke-width="1.5"/><rect x="351.5" y="120" width="297" height="18" fill="#b45309"/><text x="500" y="122" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="16.5" fill="#fff" text-anchor="middle" font-weight="700">Intermédiaire</text><text x="370" y="168" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="700" letter-spacing=".06em">Gestes</text><text x="370" y="190" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Épidural interlaminaire,</text><text x="370" y="208" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">caudal, transforaminal</text><text x="370" y="226" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Blocs paravertébraux</text><text x="370" y="244" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Branches médiales et</text><text x="370" y="262" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">radiofréquence facettaire</text><text x="370" y="280" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Blocs sympathiques : stellaire,</text><text x="370" y="298" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">sympathique lombaire,</text><text x="370" y="316" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">hypogastrique, plexus cœliaque</text><text x="370" y="334" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Gestes intradiscaux</text><text x="370" y="374" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="700" letter-spacing=".06em">Conduite</text><text x="370" y="396" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Décision partagée avec le prescripteur,</text><text x="370" y="414" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">tracée. Interruption des anticoagulants</text><text x="370" y="432" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">selon les délais ; aspirine souvent</text><text x="370" y="450" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">poursuivie.</text><text x="370" y="472" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" fill="#5b6672" text-anchor="start" font-weight="400" font-style="italic">Le risque tient au site clos, pas au saignement.</text>
<rect x="666" y="92" width="300" height="400" rx="10" fill="#fdeceb" stroke="#b91c1c" stroke-width="2"/><rect x="667.5" y="92" width="297" height="46" rx="9" fill="#b91c1c" stroke="#d5cfc5" stroke-width="1.5"/><rect x="667.5" y="120" width="297" height="18" fill="#b91c1c"/><text x="816" y="122" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="16.5" fill="#fff" text-anchor="middle" font-weight="700">Élevé</text><text x="686" y="168" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700" letter-spacing=".06em">Gestes</text><text x="686" y="190" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Stimulation médullaire</text><text x="686" y="208" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">(test et implantation)</text><text x="686" y="226" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Cathéter et pompe</text><text x="686" y="244" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">intrathécaux</text><text x="686" y="262" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Vertébroplastie,</text><text x="686" y="280" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">cyphoplastie</text><text x="686" y="298" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Décompression percutanée</text><text x="686" y="316" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Épiduroscopie</text><text x="686" y="334" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400"></text><text x="686" y="374" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700" letter-spacing=".06em">Conduite</text><text x="686" y="396" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Interruption des antithrombotiques</text><text x="686" y="414" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">selon les délais, aspirine comprise.</text><text x="686" y="432" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">Concertation avec le prescripteur</text><text x="686" y="450" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.8" fill="#14181d" text-anchor="start" font-weight="400">et le cardiologue si besoin.</text><text x="686" y="472" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" fill="#5b6672" text-anchor="start" font-weight="400" font-style="italic">Hors périmètre de ce mémo.</text>
<rect x="34" y="506" width="932" height="62" rx="10" fill="#ffffff" stroke="#d5cfc5" stroke-width="1.5"/>
<text x="54" y="530" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" fill="#14181d" text-anchor="start" font-weight="400">Un geste non listé se classe par analogie — profondeur, compressibilité du site, conséquence d'un hématome —</text><text x="54" y="549" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" fill="#14181d" text-anchor="start" font-weight="400">et le raisonnement est alors écrit dans la fiche concernée.</text>
<text x="34" y="574" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start" font-weight="400" font-style="italic">Schéma original — répartition reprise du tableau de cette fiche (Narouze et al., Reg Anesth Pain Med 2018).</text></svg>