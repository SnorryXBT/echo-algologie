<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640"><rect width="1000" height="640" fill="#f7f5f1"/><text x="34" y="44" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="22" fill="#14181d" text-anchor="start" font-weight="700">Toxicité systémique des anesthésiques locaux : la séquence, dans l'ordre</text><text x="34" y="68" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14.5" fill="#5b6672" text-anchor="start" font-weight="400">À afficher au mur de la salle de geste — on ne la relit pas au moment où elle sert.</text>
<defs><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f6fff"/></marker></defs>
<rect x="34" y="92" width="932" height="74" rx="10" fill="#fff5e6" stroke="#b45309" stroke-width="1.5"/>
<text x="54" y="120" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15.5" fill="#b45309" text-anchor="start" font-weight="700">Reconnaître</text>
<text x="54" y="144" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Goût métallique, paresthésies péribuccales, acouphènes, agitation, confusion → convulsions → troubles du rythme, collapsus, arrêt.</text>
<text x="54" y="160" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#5b6672" text-anchor="start" font-weight="400">Le tableau peut être d'emblée cardiaque. Toute bizarrerie neurologique pendant ou après une injection est une toxicité jusqu'à preuve du contraire.</text>
<rect x="34" y="186" width="300" height="132" rx="10" fill="#e8f0ff" stroke="#0f6fff" stroke-width="1.8"/><circle cx="60" cy="214" r="15" fill="#0f6fff"/><text x="60" y="219" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="86" y="219" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15.5" fill="#0f6fff" text-anchor="start" font-weight="700">Arrêter et appeler</text><text x="54" y="244" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Stopper l'injection immédiatement.</text><text x="54" y="263" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Appeler à l'aide, chariot d'urgence.</text><text x="54" y="282" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Oxygène 100 %, ventilation assistée</text><text x="54" y="301" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">si besoin. Éviter l'hyperventilation.</text>
<rect x="350" y="186" width="300" height="132" rx="10" fill="#e7f7f0" stroke="#047857" stroke-width="1.8"/><circle cx="376" cy="214" r="15" fill="#047857"/><text x="376" y="219" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="402" y="219" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15.5" fill="#047857" text-anchor="start" font-weight="700">Émulsion lipidique 20 %</text><text x="370" y="244" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">&lt; 70 kg : bolus 1,5 mL/kg (poids idéal)</text><text x="370" y="263" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">en 2–3 min, puis 0,25 mL/kg/min.</text><text x="370" y="282" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">&gt; 70 kg : bolus 100 mL en 2–3 min,</text><text x="370" y="301" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">puis 200–250 mL sur 15–20 min.</text>
<rect x="666" y="186" width="300" height="132" rx="10" fill="#e7f7f0" stroke="#047857" stroke-width="1.8"/><circle cx="692" cy="214" r="15" fill="#047857"/><text x="692" y="219" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="718" y="219" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15.5" fill="#047857" text-anchor="start" font-weight="700">Si ça ne cède pas</text><text x="686" y="244" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Répéter le bolus et doubler le débit.</text><text x="686" y="263" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Plafond usuel ≈ 12 mL/kg.</text><text x="686" y="282" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Poursuivre au moins 10 min après</text><text x="686" y="301" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">le retour à la stabilité.</text>
<rect x="34" y="336" width="300" height="132" rx="10" fill="#e8f0ff" stroke="#0f6fff" stroke-width="1.8"/><circle cx="60" cy="364" r="15" fill="#0f6fff"/><text x="60" y="369" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="86" y="369" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15.5" fill="#0f6fff" text-anchor="start" font-weight="700">Convulsions</text><text x="54" y="394" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Benzodiazépine injectable titrée.</text><text x="54" y="413" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Éviter le propofol chez un patient</text><text x="54" y="432" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">instable : il aggrave la dépression</text><text x="54" y="451" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">myocardique.</text>
<rect x="350" y="336" width="300" height="132" rx="10" fill="#fdeceb" stroke="#b91c1c" stroke-width="1.8"/><circle cx="376" cy="364" r="15" fill="#b91c1c"/><text x="376" y="369" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">5</text><text x="402" y="369" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15.5" fill="#b91c1c" text-anchor="start" font-weight="700">Arrêt circulatoire</text><text x="370" y="394" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Réanimation prolongée : la survie est</text><text x="370" y="413" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">possible après une réanimation longue.</text><text x="370" y="432" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Adrénaline à doses réduites, ≤ 1 µg/kg.</text><text x="370" y="451" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Proscrire lidocaïne et inhibiteurs calciques.</text>
<rect x="666" y="336" width="300" height="132" rx="10" fill="#e8f0ff" stroke="#0f6fff" stroke-width="1.8"/><circle cx="692" cy="364" r="15" fill="#0f6fff"/><text x="692" y="369" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">6</text><text x="718" y="369" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15.5" fill="#0f6fff" text-anchor="start" font-weight="700">Après</text><text x="686" y="394" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Surveillance prolongée en milieu</text><text x="686" y="413" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">équipé (récidive possible).</text><text x="686" y="432" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Déclaration de pharmacovigilance,</text><text x="686" y="451" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">analyse de l'événement.</text>
<line x1="334" y1="252" x2="348" y2="252" stroke="#0f6fff" stroke-width="2" marker-end="url(#ar-b)"/>
<line x1="650" y1="252" x2="664" y2="252" stroke="#0f6fff" stroke-width="2" marker-end="url(#ar-b)"/>
<line x1="334" y1="402" x2="348" y2="402" stroke="#0f6fff" stroke-width="2" marker-end="url(#ar-b)"/>
<line x1="650" y1="402" x2="664" y2="402" stroke="#0f6fff" stroke-width="2" marker-end="url(#ar-b)"/>
<rect x="34" y="486" width="932" height="86" rx="10" fill="#ffffff" stroke="#d5cfc5" stroke-width="1.5"/>
<text x="54" y="514" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" fill="#14181d" text-anchor="start" font-weight="700">Prévention — c'est là que tout se joue</text>
<text x="54" y="538" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">Dose calculée avant le geste et additionnée entre les blocs · aspiration répétée · injection fractionnée par 2–3 mL ·</text><text x="54" y="558" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.2" fill="#14181d" text-anchor="start" font-weight="400">surveillance verbale du patient pendant l'injection · émulsion lipidique présente, non périmée, posologie affichée.</text>
<text x="34" y="622" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start" font-weight="400" font-style="italic">Schéma original — posologies reprises du tableau « chariot d'urgence » de cette fiche (protocole ASRA).</text></svg>